<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>QuickMart BD</title>
<style>
:root{--g:#0b6b3a;--g2:#0e8a4b;--r:#d62828;--ink:#1c2a22}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;max-width:900px;margin:auto}
button{cursor:pointer;border:0;border-radius:20px;background:var(--g);color:#fff;padding:9px 14px;font-weight:600;font-size:14px}
input,select,textarea{display:block;width:100%;margin:6px 0;padding:11px 12px;border:1px solid #c9d6cd;border-radius:10px;font-size:15px;background:#fff}
#hd{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eee}
#hd img{height:38px;width:38px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}
#hd input{margin:0;flex:1;border-radius:22px;background:#f1f1f1;border:0;padding:10px 14px}
.ic{background:none;color:var(--ink);font-size:22px;padding:4px 6px;position:relative}
.bg{position:absolute;top:-2px;right:-2px;background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:1px 5px}
#promo{flex-wrap:wrap;display:flex;align-items:center;gap:8px;background:#e8f5ec;color:var(--g);padding:6px 10px;font-size:13px;font-weight:600}
#promo select{width:auto;margin:0;padding:5px 8px;border-radius:14px;font-size:13px}
#promo button{padding:4px 10px;font-size:13px}
#promo span{flex:1;text-align:center}
.menu{position:fixed;top:58px;right:8px;width:260px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:12px;z-index:30}
.menu a,.menu div.it{display:block;padding:12px 4px;border-bottom:1px solid #eee;color:var(--ink);text-decoration:none;cursor:pointer}
.menu button.big{width:100%;padding:13px;font-size:16px}
#wrap{display:flex;align-items:flex-start}
#cats{width:92px;flex:none;background:#f4f4f4;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto}
#cats div{padding:14px 6px;font-size:13px;text-align:center;cursor:pointer;border-left:3px solid transparent}
#cats div.on{background:#fff;border-left-color:var(--g);font-weight:700;color:var(--g)}
#main{flex:1;padding:8px;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{background:#eee;color:var(--ink)} .tabs button.on{background:var(--g);color:#fff}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pc{position:relative;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
.pc img,.ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}
.pb{padding:6px 8px 8px}
.nm{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.sh{font-size:11px;color:#777;margin:2px 0}
.pr{font-size:18px;font-weight:800;color:var(--r)} .pr s{font-size:12px;color:#999;font-weight:400}
.off{display:inline-block;border:1px solid var(--r);color:var(--r);font-size:11px;padding:0 5px;border-radius:4px;margin-left:4px}
.row{display:flex;align-items:center;justify-content:space-between}
.add{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:0;font-size:18px}
.so{position:absolute;top:0;left:0;right:0;aspect-ratio:1/1;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:var(--r);font-weight:800;font-size:18px}
.rv{font-size:11px;color:var(--g);cursor:pointer;margin-top:2px}
.card{background:#f7f9f8;border-radius:12px;padding:10px;margin:8px 0}
.hero{width:100%;border-radius:10px;margin-bottom:8px}
body{padding-bottom:70px}#bn{position:fixed;bottom:0;left:0;right:0;max-width:900px;margin:auto;display:flex;background:#fff;border-top:1px solid #ddd;z-index:25}#bn div{flex:1;text-align:center;padding:6px 0;font-size:11px;cursor:pointer}#bn b{display:block;font-size:21px;font-weight:400;position:relative}#bn b .bg{right:30%}.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cg div{background:#f4f7f5;border-radius:12px;padding:16px 4px;text-align:center;cursor:pointer;font-size:13px}.cg b{display:block;font-size:30px;font-weight:400}
</style></head><body>
<header id=hd></header><div id=promo></div><div id=menu class=menu hidden></div><div id=auth style="padding:0 10px"></div>
<div id=wrap><main id=main></main></div><nav id=bn></nav>
<script type=module>
import { sb, $, esc, t, toggleLang, me, authBox, getFees, upload, AREAS, fillDistricts, fillUpazilas } from './app.js';
import { BRAND_NAME, LOGO_URL, BANNER_URL } from './config.js';
document.title = BRAND_NAME;
const CATS = [['', '🏠', 'All'], ['Medicine', '💊', 'Medicine'], ['Garments - Men', '👔', "Men's"], ['Garments - Women', '👗', "Women's"], ['Garments - Kids', '🧸', 'Kids'], ['Grocery', '🛒', 'Grocery'], ['Books', '📚', 'Books'], ['Homemade', '🍰', 'Homemade']];
let PR = [], wish = JSON.parse(localStorage.wish || '[]'), user, shop, tab = 'local', q = '', cat = '', cart = JSON.parse(localStorage.cart || '[]'), zones = [], fees = {}, area = localStorage.area || 'Dhaka', upz = localStorage.upz || '', timer;
const save = () => { localStorage.cart = JSON.stringify(cart); $('#cn').textContent = cart.length; };
async function init() {
  user = await me(); shop = user ? (await sb.from('shops').select('id,verified').eq('owner', user.id).maybeSingle()).data : null; fees = await getFees();
  zones = (await sb.from('delivery_zones').select('*')).data || [];
  $('#hd').innerHTML = `<img src="${esc(LOGO_URL)}" onerror="this.style.display='none'"><input id=q placeholder="${t('search')}…"><button class=ic id=vs>🎤</button>`;
  $('#bn').innerHTML = `<div id=nh><b>🏠</b>Home</div><div id=nc><b>🗂️</b>Categories</div><div id=cb><b>🛒<span class=bg id=cn>${cart.length}</span></b>Cart</div><div id=mo2><b>📦</b>Orders</div><div id=acc><b>👤</b>Account</div>`;
  $('#promo').innerHTML = `<select id=ar></select><select id=uz></select><button id=gps>📍</button>`;
  fillDistricts($('#ar'), area); fillUpazilas($('#uz'), area, upz, true);
  $('#ar').onchange = e => setArea(e.target.value, '');
  $('#uz').onchange = e => { upz = e.target.value; localStorage.upz = upz; load(); };
  $('#q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value; load(); }, 350); };
  $('#gps').onclick = () => navigator.geolocation?.getCurrentPosition(async p => {
    try { const r = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)).json();
      const txt = JSON.stringify(r.address || {}).toLowerCase(); const hit = Object.keys(AREAS).find(d => txt.includes(d.toLowerCase()));
      if (hit) setArea(hit, ''); else alert('Area not served yet'); } catch { alert('Could not detect'); } });
  $('#vs').onclick = () => { const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return alert('Voice not supported');
    const r = new R(); r.lang = localStorage.lang === 'bn' ? 'bn-BD' : 'en-US'; r.onresult = e => { $('#q').value = e.results[0][0].transcript; q = $('#q').value; load(); }; r.start(); };
  $('#cb').onclick = showCart; $('#nh').onclick = () => { cat = ''; tab = 'local'; q = ''; $('#q').value = ''; $('#menu').hidden = true; load(); }; $('#nc').onclick = showCats; $('#mo2').onclick = showOrders;
  $('#acc').onclick = () => { const m = $('#menu'); m.hidden = !m.hidden; if (m.hidden) return;
    m.innerHTML = (user ? `<b>${esc(user.name || 'Account')}</b>` : `<button class=big id=si>${t('login')} / ${t('signup')}</button>`) +
      `<div class=it id=mo>📦 ${t('orders')}</div><div class=it id=mw>❤️ Wishlist</div><div class=it id=ml>⚙️ Settings: Language EN/বাং</div><a href="vendor.html">🏪 ${shop ? 'My Shop' : 'Become a seller'}</a>` + (user ? `<div class=it id=mx>🚪 ${t('logout')}</div>` : '');
    if ($('#si')) $('#si').onclick = () => { m.hidden = true; authBox($('#auth'), 'customer', () => location.reload()); };
    $('#mo').onclick = () => { m.hidden = true; showOrders(); }; $('#mw').onclick = () => { m.hidden = true; showWish(); }; $('#ml').onclick = toggleLang;
    if ($('#mx')) $('#mx').onclick = async () => { await sb.auth.signOut(); location.reload(); }; };
  load();
}
function setArea(d, u) { area = d; upz = u; localStorage.area = d; localStorage.upz = u; fillDistricts($('#ar'), d); fillUpazilas($('#uz'), d, u, true); load(); }
function showCats() { $('#menu').hidden = true; $('#main').innerHTML = `<h3>Categories</h3><div class=cg>${CATS.map(c => `<div data-c="${c[0]}"><b>${c[1]}</b>${c[2]}</div>`).join('')}</div>`; document.querySelectorAll('.cg div').forEach(d => d.onclick = () => { cat = d.dataset.c; load(); }); }
function isOpenNow(s) { if (s.is_open === false) return false; if (!s.open_time || !s.close_time) return true; const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), f = x => +x.slice(0, 2) * 60 + +x.slice(3, 5), a = f(s.open_time), b = f(s.close_time); return a <= b ? m >= a && m < b : m >= a || m < b; }
function addCart(p) { const i = cart.find(x => x.id === p.id); i ? i.qty++ : cart.push({ id: p.id, name: p.name, price: p.offer_price ?? p.price, shop_id: p.shop_id, scope: p.scope, qty: 1 }); save(); }
function track(s) { if (s === 'cancelled') return '❌ Cancelled'; if (s === 'awaiting_customer') return '⏳ Waiting for your confirmation'; const i = ['pending', 'accepted', 'shipped', 'delivered'].indexOf(s); return ['Ordered', 'Accepted', 'Shipped', 'Delivered'].map((x, k) => (k <= i ? '🟢 ' : '⚪ ') + x).join(' → '); }
function detail(id) {
  const p = PR.find(x => x.id === id); if (!p) return; const n = (p.shops.phone || '').replace(/\D/g, ''), wa = n.startsWith('0') ? '88' + n : n, liked = wish.includes(id);
  $('#main').innerHTML = `<button id=bk>←</button>${p.image_url ? `<img src="${esc(p.image_url)}" style="width:100%;border-radius:12px;margin-top:8px">` : ''}<h3>${esc(p.name)}</h3><div class=pr>৳${p.offer_price ?? p.price}${p.offer_price ? ` <s>৳${p.price}</s>` : ''}</div><p>${esc(p.description)}</p><p>🏪 ${esc(p.shops.name)}</p>
  <div class=tabs>${p.in_stock ? '<button id=da>🛒 Add to cart</button>' : '<b style=color:#d62828>Sold out</b>'}<button id=dw>${liked ? '💔 Remove' : '❤️ Wishlist'}</button>${n ? `<a href="tel:${esc(p.shops.phone)}"><button>📞 Call</button></a><a href="https://wa.me/${wa}" target=_blank><button>💬 WhatsApp</button></a>` : ''}<button id=ds>🔗 Share</button><button id=dr>★ Reviews</button></div>`;
  $('#bk').onclick = load; $('#dr').onclick = () => reviews(id);
  if ($('#da')) $('#da').onclick = () => { addCart(p); $('#da').textContent = '✓ Added'; };
  $('#dw').onclick = () => { wish = liked ? wish.filter(x => x !== id) : [...wish, id]; localStorage.wish = JSON.stringify(wish); detail(id); };
  $('#ds').onclick = () => { const u = location.origin + location.pathname; navigator.share ? navigator.share({ title: p.name, url: u }) : (navigator.clipboard?.writeText(u), alert('Link copied')); };
}
async function showWish() {
  const { data = [] } = wish.length ? await sb.from('products').select('*, shops(name,phone)').in('id', wish) : { data: [] }; PR = data;
  $('#main').innerHTML = `<h3>❤️ Wishlist</h3>${data.map(p => `<div class=card><b>${esc(p.name)}</b> ৳${p.offer_price ?? p.price} <button data-d="${p.id}">Open</button></div>`).join('') || '<p>Nothing saved yet</p>'}`;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => detail(b.dataset.d));
}
function tabsHtml() { return `<div class=tabs>${cat ? `<button id=cc>✕ ${esc(cat)}</button>` : ''}${['local', 'all', 'offers'].map(x => `<button data-t=${x} class="${x === tab ? 'on' : ''}">${t(x)}</button>`).join('')}</div>`; }
async function load() {
  let qq = sb.from('products').select('*, shops!inner(name,area,verified,phone,is_open,open_time,close_time)').eq('shops.verified', true).eq('shops.is_open', true);
  if (tab === 'local') { qq = qq.eq('scope', 'local').eq('shops.area', area); if (upz) qq = qq.eq('shops.upazila', upz); }
  if (tab === 'all') qq = qq.eq('scope', 'all');
  if (tab === 'offers') qq = qq.not('offer_price', 'is', null);
  if (cat) qq = qq.eq('category', cat);
  if (q) qq = qq.ilike('name', `%${q}%`);
  const { data: all = [] } = await qq.order('created_at', { ascending: false }); const data = all.filter(p => isOpenNow(p.shops));
  PR = data;
  const hero = (BANNER_URL && !q && !cat) ? `<img class=hero src="${esc(BANNER_URL)}" onerror="this.style.display='none'">` : '';
  $('#main').innerHTML = hero + tabsHtml() + `<div class=g>${data.map(p => { const pct = p.offer_price ? Math.round((1 - p.offer_price / p.price) * 100) : 0;
    return `<div class=pc>${p.image_url ? `<img src="${esc(p.image_url)}">` : `<div class=ph>${esc((p.name || '?')[0])}</div>`}${p.in_stock ? '' : `<div class=so>${t('soldout')}</div>`}
    <div class=pb><div class=nm data-d='${p.id}'>${esc(p.name)}</div><div class=sh>${esc(p.shops.name)}</div>
    <div class=pr>৳${p.offer_price ?? p.price}${p.offer_price ? ` <s>৳${p.price}</s><span class=off>${pct}% OFF</span>` : ''}</div>
    <div class=row><span class=rv data-r='${p.id}'>★ Reviews</span>${p.in_stock ? `<button class=add data-a='${p.id}'>🛒</button>` : ''}</div></div></div>`; }).join('') || '<p>No products here yet</p>'}</div>`;
  if ($('#cc')) $('#cc').onclick = () => { cat = ''; load(); };
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; load(); });
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const p = data.find(x => x.id === b.dataset.a);
    const i = cart.find(x => x.id === p.id); i ? i.qty++ : cart.push({ id: p.id, name: p.name, price: p.offer_price ?? p.price, shop_id: p.shop_id, scope: p.scope, qty: 1 });
    save(); b.textContent = '✓'; setTimeout(() => b.textContent = '🛒', 700); });
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => detail(b.dataset.d));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => reviews(b.dataset.r));
}
async function reviews(pid) {
  const { data = [] } = await sb.from('reviews').select('*').eq('product_id', pid).order('created_at', { ascending: false });
  $('#main').innerHTML = `<button onclick=location.reload()>←</button><h3>Reviews</h3>${data.map(r => `<div class=card>${'★'.repeat(r.rating)}<br>${esc(r.comment)}${r.photo_url ? `<br><img src="${esc(r.photo_url)}" style=max-width:120px>` : ''}</div>`).join('') || '<p>No reviews</p>'}
  ${user ? `<h4>Write review</h4><select id=rt><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea id=rc></textarea><input id=rp type=file accept=image/*><button id=rs>Submit</button>` : '<p>Login to review</p>'}`;
  if (user) $('#rs').onclick = async () => { let photo_url = null; const f = $('#rp').files[0]; if (f) photo_url = await upload(f, 'reviews');
    const { error } = await sb.from('reviews').insert({ product_id: pid, customer: user.id, rating: +$('#rt').value, comment: $('#rc').value, photo_url }); error ? alert(error.message) : reviews(pid); };
}
async function showCart() {
  if (!user) { $('#main').innerHTML = ''; return authBox($('#auth'), 'customer', () => location.reload()); }
  const sub = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const shops = [...new Set(cart.map(i => i.shop_id))];
  const si = shops.length === 1 ? ((await sb.from('shops').select('bkash,nagad,rocket').eq('id', shops[0]).maybeSingle()).data || {}) : null;
  const feeOf = (scope) => scope === 'all' ? fees.courier_fee : +(zones.find(z => z.area === area)?.fee ?? fees.default_local_fee ?? 60);
  $('#main').innerHTML = `<button onclick=location.reload()>←</button><h3>${t('cart')}</h3>${cart.map((i, n) => `<div class=card>${esc(i.name)} x${i.qty} = ৳${i.price * i.qty} <button data-x=${n}>✕</button></div>`).join('') || 'Empty'}
  <p><b>Subtotal ৳${sub}</b></p><input id=cp placeholder="Coupon code"><input id=ph type=tel placeholder="Phone number (required)"><input id=ad placeholder="${t('addr')}"><select id=pm><option value=cod>Cash on Delivery</option><option value=bkash>bKash</option><option value=nagad>Nagad</option><option value=rocket>Rocket</option></select><div id=payb></div>
  <p><small>Flat delivery fee per shop-order: local ৳${feeOf('local')}, nationwide ৳${feeOf('all')}.</small></p><button id=pl>${t('order')}</button>`;
  $('#pm').onchange = () => { const m = $('#pm').value; if (m === 'cod') return $('#payb').innerHTML = ''; if (!si) return $('#payb').innerHTML = '<p>Online payment works for one shop at a time. Remove other shops or choose Cash on Delivery.</p>';
    const fee = feeOf(cart.some(i => i.scope === 'all') ? 'all' : 'local'); $('#payb').innerHTML = `<div class=card>Send <b>৳${sub + fee}</b> (before coupon) to the shop's ${m} number: <b>${esc(si[m]) || 'not set by the shop yet'}</b><br>Then enter the details below. The shop will confirm your payment.<input id=tx placeholder="Transaction ID (TrxID)"><input id=pf type=tel placeholder="Number you sent from"></div>`; };
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { cart.splice(+b.dataset.x, 1); save(); showCart(); });
  $('#pl').onclick = async () => {
    if (!cart.length) return; if (!$('#ph').value.trim() || !$('#ad').value.trim()) return alert('Phone and address are required'); const pm = $('#pm').value; if (pm !== 'cod' && (shops.length > 1 || !$('#tx').value.trim() || !$('#pf').value.trim())) return alert(shops.length > 1 ? 'Online payment works for one shop at a time' : 'Enter the TrxID and the number you paid from'); const code = $('#cp').value.trim(); let cpn = null;
    if (code) { cpn = (await sb.from('coupons').select('*').eq('code', code).maybeSingle()).data; if (!cpn) return alert('Invalid coupon'); }
    for (const sid of shops) { const items = cart.filter(i => i.shop_id === sid); const s = items.reduce((a, i) => a + i.price * i.qty, 0); const scope = items.some(i => i.scope === 'all') ? 'all' : 'local';
      const pct = cpn && cpn.shop_id === sid ? +cpn.percent : 0;
      const { error } = await sb.from('orders').insert({ customer: user.id, shop_id: sid, items, subtotal: s, discount: s * pct / 100, delivery_fee: feeOf(scope), payment: pm, pay_method: pm, pay_status: pm === 'cod' ? 'cod' : 'submitted', trx_id: pm === 'cod' ? null : $('#tx').value.trim(), pay_from: pm === 'cod' ? null : $('#pf').value.trim(), address: $('#ad').value, phone: $('#ph').value, area, upazila: upz, scope }); if (error) return alert(error.message); }
    cart = []; save(); alert('Order placed'); showOrders();
  };
}
async function showOrders() {
  if (!user) return authBox($('#auth'), 'customer', () => location.reload());
  const { data = [] } = await sb.from('orders').select('*, shops(name)').eq('customer', user.id).order('created_at', { ascending: false });
  $('#main').innerHTML = `<button onclick=location.reload()>←</button><h3>${t('orders')}</h3>${data.map(o => `<div class=card><b>${esc(o.shops?.name)}</b> <br>${track(o.status)}<br>${{ submitted: '⏳ Payment under review', paid: '✅ Paid', rejected: '❌ Payment rejected, contact the shop' }[o.pay_status] || ''}<br>Total ৳${o.subtotal - o.discount + +o.delivery_fee}
  ${o.status === 'awaiting_customer' ? `<p>Vendor changed delivery fee: ৳${o.delivery_fee} → ৳${o.new_fee}</p><button data-ok=${o.id}>Accept</button> <button data-no=${o.id} style="background:#d62828">Cancel order</button>` : ''}</div>`).join('') || '<p>No orders yet</p>'}`;
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { const o = data.find(x => x.id === b.dataset.ok); await sb.from('orders').update({ delivery_fee: o.new_fee, status: 'accepted' }).eq('id', o.id); showOrders(); });
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => { await sb.from('orders').update({ status: 'cancelled' }).eq('id', b.dataset.no); showOrders(); });
}
init();
</script></body></html>
