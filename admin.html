<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title></head><body>
<div id=auth></div><div id=main></div>
<script type=module>
import { brandHeader, sb, $, esc, me, authBox, getFees, css, upload, startNotifs, commOf } from './app.js';
document.head.insertAdjacentHTML('beforeend', css);
document.body.insertAdjacentHTML('afterbegin', brandHeader('Admin'));
let tab = 'dash';
async function init() {
  const u = await me(); if (!u) return authBox($('#auth'), 'customer', init);
  if (u.role !== 'admin') return $('#main').innerHTML = '<h3>Not an admin</h3>';
  $('#auth').innerHTML = ''; startNotifs(u.id); load();
}
async function load() {
  const [{ data: shops = [] }, { data: ords = [] }, { data: zones = [] }, { data: reps = [] }, fees, { data: pays = [] }, { data: info = [] }, { data: tix = [] }, { data: riders = [] }, { data: cats = [] }, { data: gcps = [] }, { data: profs = [] }] = await Promise.all([sb.from('shops').select('*').order('verified'), sb.from('orders').select('*').order('created_at', { ascending: false }), sb.from('delivery_zones').select('*'), sb.from('reviews').select('*').eq('reported', true), getFees(), sb.from('commission_payments').select('*').order('created_at', { ascending: false }), sb.from('site_info').select('*'), sb.from('tickets').select('*').order('created_at', { ascending: false }), sb.from('riders').select('*'), sb.from('categories').select('*').order('sort'), sb.from('coupons').select('*').is('shop_id', null), sb.from('profiles').select('*')]);
  const I = Object.fromEntries(info.map(r => [r.key, r.value])), pct = fees.commission_percent || 0, name = id => esc(shops.find(s => s.id === id)?.name);
  const done = ords.filter(o => o.status === 'delivered'), sales = done.reduce((s, o) => s + o.subtotal - o.discount, 0), earned = Math.round(done.reduce((s, o) => s + commOf(o, fees), 0));
  const ok = pays.filter(p => p.status === 'confirmed'), got = ok.reduce((s, p) => s + +p.amount, 0);
  const rows = shops.map(s => { const sl = done.filter(o => o.shop_id === s.id).reduce((a, o) => a + o.subtotal - o.discount, 0); const paid = ok.filter(p => p.shop_id === s.id).reduce((a, p) => a + +p.amount, 0); return { s, sl, due: Math.round(done.filter(o => o.shop_id === s.id).reduce((a, o) => a + commOf(o, fees), 0) - paid) }; });
  const pend = pays.filter(p => p.status === 'pending');
  const nav = [['dash', '📊 Dashboard'], ['shops', '🏪 Shops'], ['orders', '📦 Orders'], ['money', `💰 Commission${pend.length ? ' (' + pend.length + ')' : ''}`], ['riders', '🛵 Riders'], ['tix', `🛟 Tickets${tix.some(x => x.status === 'open') ? ' (' + tix.filter(x => x.status === 'open').length + ')' : ''}`], ['users', '👥 Users'], ['reviews', '⭐ Reviews'], ['settings', '⚙️ Settings']];
  const dk = d => d.toISOString().slice(0, 10), dayS = {}, prodS = {}; done.forEach(o => { const k = dk(new Date(o.created_at)); dayS[k] = (dayS[k] || 0) + o.subtotal - o.discount; o.items.forEach(i => { prodS[i.name] = (prodS[i.name] || 0) + i.qty; }); });
  const days = [...Array(7)].map((_, k) => { const x = new Date(Date.now() - (6 - k) * 864e5); return { l: dk(x).slice(5), v: Math.round(dayS[dk(x)] || 0) }; }), mx = Math.max(1, ...days.map(x => x.v));
  const topP = Object.entries(prodS).sort((a, b) => b[1] - a[1]).slice(0, 5), topS = [...rows].sort((a, b) => b.sl - a.sl).slice(0, 5);
  const an = `<div class=c><h4>Sales, last 7 days</h4>${days.map(x => `<div style="display:flex;align-items:center;gap:6px;margin:3px 0"><span style="width:42px;font-size:12px">${x.l}</span><div style="background:#0e8a4b;height:14px;border-radius:4px;width:${Math.round(x.v / mx * 60)}%;min-width:2px"></div><span style="font-size:12px">৳${x.v}</span></div>`).join('')}</div><div class=c><h4>Top products</h4>${topP.map(p => `${esc(p[0])} — ${p[1]} sold`).join('<br>') || '-'}</div><div class=c><h4>Top shops</h4>${topS.map(r => `${esc(r.s.name)} — ৳${r.sl}`).join('<br>') || '-'}</div>`;
  let body = '';
  if (tab === 'dash') body = `<div class=stats><div class=hl><b>৳${sales}</b>Total sales</div><div class=hl><b>৳${earned}</b>Commission earned (${pct}%)</div><div><b>৳${got}</b>Commission received</div><div><b>৳${earned - got}</b>Commission due</div><div><b>${ords.length}</b>Orders</div><div><b>${shops.length}</b>Shops</div><div><b>${profs.length}</b>Users</div><div><b>${profs.filter(p => p.referred_by).length}</b>Referred users</div></div>${an}<h4>Commission due by shop</h4>${rows.map(r => `<div class=c><b>${esc(r.s.name)}</b><br>Sales ৳${r.sl} · <b style=color:#d62828>Due ৳${r.due}</b></div>`).join('') || '<p>No shops</p>'}`;
  if (tab === 'users') body = profs.filter(p => p.role !== 'admin').map(p => { const mine = ords.filter(o => o.customer === p.id), can = mine.filter(o => o.status === 'cancelled').length;
    return `<div class=c><b>${esc(p.name || 'No name')}</b>${p.blocked ? ' <span class=pill style="background:#fde;color:#d62828">BLOCKED</span>' : ''}${can >= 3 ? ' ⚠️' : ''}<br>Orders ${mine.length} · Cancelled ${can}<br><button class="${p.blocked ? '' : 'del'}" data-bk=${p.id} data-v=${p.blocked}>${p.blocked ? 'Unblock' : 'Block'}</button></div>`; }).join('') || '<p>No users</p>';
  if (tab === 'shops') body = shops.map(s => `<div class=c><b>${esc(s.name)}</b> <span class=pill>${s.verified ? 'Verified' : 'Pending'}</span><br>${esc(s.area)}, ${esc(s.upazila)} · NID ${esc(s.nid_no)} · ${esc(s.phone)}<br><a href="${esc(s.photo_url)}" target=_blank>Owner photo</a> · <a href="${esc(s.signboard_url)}" target=_blank>Signboard</a><br>${s.verified ? `<button class=del data-bl=${s.id}>Block</button>` : `<button data-v=${s.id}>Verify</button>`}${s.verified ? `<button data-ft=${s.id}>⭐ Feature…</button>${s.featured_until && new Date(s.featured_until) > new Date() ? ' <span class=pill>Featured</span>' : ''}` : ''}</div>`).join('') || '<p>No shops</p>';
  if (tab === 'orders') body = '<button id=csv>⬇ Download all orders (CSV)</button>' + ords.slice(0, 40).map(o => `<div class=c><b>${name(o.shop_id)}</b> <span class=pill>${o.status}</span> <span class=pill>${o.pay_status || 'cod'}</span><br>৳${o.subtotal - o.discount + +o.delivery_fee} · ${esc(o.area)}, ${esc(o.upazila)} · ${new Date(o.created_at).toLocaleDateString()}<br><select data-as=${o.id}><option value="">Assign rider…</option>${riders.filter(r => r.active).map(r => `<option value=${r.id} ${r.id === o.rider_id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>`).join('') || '<p>No orders</p>';
  if (tab === 'money') body = `<h4>Commission payment requests</h4>${pend.map(p => `<div class=c><b>${name(p.shop_id)}</b> · ৳${p.amount} · TrxID ${esc(p.trx_id)}<br><button data-ok=${p.id}>Confirm</button><button class=del data-no=${p.id}>Reject</button></div>`).join('') || '<p>No pending requests</p>'}<h4>History</h4>${pays.filter(p => p.status !== 'pending').map(p => `<div class=c>${name(p.shop_id)} · ৳${p.amount} · <span class=pill>${p.status}</span></div>`).join('')}`;
  if (tab === 'riders') body = riders.map(r => `<div class=c><b>${esc(r.name)}</b> · ${esc(r.phone)} <span class=pill>${r.active ? 'Active' : 'Off'}</span><br><button data-rt=${r.id} data-a=${r.active}>${r.active ? 'Deactivate' : 'Activate'}</button></div>`).join('') + `<div class=c><h4>Add rider</h4><input id=rn placeholder=Name><input id=rp type=tel placeholder=Phone><button id=ra>Add rider</button></div>`;
  if (tab === 'tix') body = tix.map(x => `<div class=c><span class=pill>${esc(x.kind)}</span> <span class=pill>${x.status}</span><br>${esc(x.message)}${x.order_id ? `<br><small>Order ${esc(x.order_id).slice(0, 8)}</small>` : ''}${x.reply ? `<br><b>Reply:</b> ${esc(x.reply)}` : ''}${x.status === 'open' ? `<br><button data-rp=${x.id}>Reply &amp; close</button>` : ''}</div>`).join('') || '<p>No messages</p>';
  if (tab === 'reviews') body = reps.map(r => `<div class=c>${'★'.repeat(r.rating)} ${esc(r.comment)}<br><i>Vendor note: ${esc(r.report_note)}</i><br><button class=del data-d=${r.id}>Remove review</button><button data-k=${r.id}>Keep review</button></div>`).join('') || '<p>No reported reviews</p>';
  if (tab === 'settings') body = `<div class=c><h4>Fees</h4><label>Commission %</label><input id=cm type=number value="${pct}"><label>Nationwide courier fee</label><input id=cf type=number value="${fees.courier_fee ?? ''}"><label>Default local delivery fee</label><input id=df type=number value="${fees.default_local_fee ?? 60}"></div>
    <div class=c><h4>Our payment numbers (for commission)</h4><input id=ab type=tel placeholder="bKash" value="${esc(I.admin_bkash)}"><input id=an type=tel placeholder="Nagad" value="${esc(I.admin_nagad)}"><input id=ar type=tel placeholder="Rocket" value="${esc(I.admin_rocket)}"><input id=sp type=tel placeholder="Support phone" value="${esc(I.support_phone)}"></div>
    <div class=c><h4>District delivery fees</h4>${zones.map(z => `<div>${esc(z.area)}: ৳<input style="display:inline;width:80px" type=number value=${z.fee} data-z="${esc(z.area)}"></div>`).join('')}<input id=na placeholder="District name (exact)"><input id=nfee type=number placeholder=Fee></div><div class=c><h4>Categories</h4>${cats.map(c => `<div>${esc(c.icon)} ${esc(c.name)} <button class=del data-cd="${esc(c.name)}">✕</button></div>`).join('')}<input id=cn placeholder="New category name"><input id=ci placeholder="Emoji icon"></div><div class=c><h4>Commission by category (blank = default ${pct}%)</h4>${cats.map(c => `<label>${esc(c.name)} (%)</label><input type=number data-cm="${esc(c.name)}" value="${fees['comm:' + c.name] ?? ''}" placeholder="default">`).join('')}</div><div class=c><h4>Platform coupons (all shops)</h4>${gcps.map(c => `<div>${esc(c.code)} -${c.percent}% <button class=del data-gd="${esc(c.code)}">✕</button></div>`).join('')}<input id=gc placeholder=CODE><input id=gp type=number placeholder="% off"></div><div class=c><h4>Send message to all users</h4><input id=bt placeholder="Title"><textarea id=bm rows=2 placeholder="Message"></textarea><button id=bc>Send to everyone</button></div><div class=c><h4>Home banner</h4><input id=bn type=file accept=image/*></div><button id=ss>Save all settings</button>`;
  $('#main').innerHTML = `<div class=tabs2>${nav.map(n => `<button class="${tab === n[0] ? 'on' : ''}" data-tab=${n[0]}>${n[1]}</button>`).join('')}</div>${body}`;
  const all = (s, fn) => document.querySelectorAll(s).forEach(fn), up = (t, id, u) => sb.from(t).update(u).eq('id', id).then(load);
  all('[data-bk]', b => b.onclick = () => up('profiles', b.dataset.bk, { blocked: b.dataset.v !== 'true' }));
  if ($('#bc')) $('#bc').onclick = async () => { if (!$('#bt').value.trim() || !$('#bm').value.trim()) return alert('Title and message required'); const { data, error } = await sb.rpc('broadcast', { t: $('#bt').value.trim(), b: $('#bm').value.trim() }); alert(error ? error.message : 'Sent to ' + data + ' users'); };
  all('[data-tab]', b => b.onclick = () => { tab = b.dataset.tab; load(); });
  all('[data-v]', b => b.onclick = () => up('shops', b.dataset.v, { verified: true })); all('[data-bl]', b => b.onclick = () => up('shops', b.dataset.bl, { verified: false }));
  all('[data-ok]', b => b.onclick = () => up('commission_payments', b.dataset.ok, { status: 'confirmed' })); all('[data-no]', b => b.onclick = () => up('commission_payments', b.dataset.no, { status: 'rejected' }));
  all('[data-ft]', b => b.onclick = () => { const n = +prompt('Feature this shop for how many days?', '7'); if (n > 0) up('shops', b.dataset.ft, { featured_until: new Date(Date.now() + n * 864e5).toISOString() }); });
  all('[data-as]', b => b.onchange = () => up('orders', b.dataset.as, { rider_id: b.value || null }));
  all('[data-rt]', b => b.onclick = () => up('riders', b.dataset.rt, { active: b.dataset.a !== 'true' }));
  if ($('#ra')) $('#ra').onclick = async () => { if (!$('#rn').value.trim()) return; await sb.from('riders').insert({ name: $('#rn').value.trim(), phone: $('#rp').value }); load(); };
  all('[data-cd]', b => b.onclick = async () => { await sb.from('categories').delete().eq('name', b.dataset.cd); load(); });
  all('[data-gd]', b => b.onclick = async () => { await sb.from('coupons').delete().eq('code', b.dataset.gd); load(); });
  all('[data-rp]', b => b.onclick = () => { const r = prompt('Your reply'); if (r) up('tickets', b.dataset.rp, { reply: r, status: 'closed' }); });
  if ($('#csv')) $('#csv').onclick = () => { const L = [['date', 'shop', 'status', 'payment', 'subtotal', 'discount', 'delivery_fee', 'district', 'upazila']].concat(ords.map(o => [o.created_at, (shops.find(s => s.id === o.shop_id) || {}).name, o.status, o.pay_status || 'cod', o.subtotal, o.discount, o.delivery_fee, o.area, o.upazila]));
    const csv = L.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'orders.csv'; a.click(); };
  all('[data-d]', b => b.onclick = async () => { await sb.from('reviews').delete().eq('id', b.dataset.d); load(); }); all('[data-k]', b => b.onclick = () => up('reviews', b.dataset.k, { reported: false }));
  if ($('#ss')) $('#ss').onclick = async () => {
    await sb.from('settings').upsert([{ key: 'commission_percent', value: +$('#cm').value }, { key: 'courier_fee', value: +$('#cf').value }, { key: 'default_local_fee', value: +$('#df').value }]);
    await sb.from('site_info').upsert([['admin_bkash', '#ab'], ['admin_nagad', '#an'], ['admin_rocket', '#ar'], ['support_phone', '#sp']].map(([k, id]) => ({ key: k, value: $(id).value })));
    const z = [...document.querySelectorAll('[data-z]')].map(i => ({ area: i.dataset.z, fee: +i.value })); if ($('#na').value) z.push({ area: $('#na').value.trim(), fee: +$('#nfee').value || 60 }); if (z.length) await sb.from('delivery_zones').upsert(z); if ($('#cn').value.trim()) await sb.from('categories').insert({ name: $('#cn').value.trim(), icon: $('#ci').value || '🛍️', sort: cats.length + 1 }); if ($('#gc').value.trim()) await sb.from('coupons').insert({ code: $('#gc').value.trim(), percent: +$('#gp').value, shop_id: null }); for (const i of document.querySelectorAll('[data-cm]')) { const k = 'comm:' + i.dataset.cm; i.value === '' ? await sb.from('settings').delete().eq('key', k) : await sb.from('settings').upsert({ key: k, value: +i.value }); }
    if ($('#bn').files[0]) await sb.from('site_info').upsert({ key: 'banner_url', value: await upload($('#bn').files[0], 'banners') }); alert('Saved'); load(); };
}
init();
</script></body></html>
