<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Vendor</title></head><body>
<div id=auth></div><div id=main></div>
<script type=module>
import { brandHeader, sb, $, esc, me, authBox, upload, css, fillDistricts, fillUpazilas } from './app.js';
document.head.insertAdjacentHTML('beforeend', css);
document.body.insertAdjacentHTML('afterbegin', brandHeader('Vendor'));
let user, shop;
async function init() {
  user = await me(); if (!user) return authBox($('#auth'), 'customer', init);
  $('#auth').innerHTML = '';
  shop = (await sb.from('shops').select('*').eq('owner', user.id).maybeSingle()).data;
  shop ? dash() : register();
}
async function register() {
  const zones = (await sb.from('delivery_zones').select('area')).data || [];
  $('#main').innerHTML = `<h3>Register shop</h3><input id=sn placeholder="Shop name"><label>District</label><select id=sa></select><label>Upazila / Thana</label><select id=su></select><input id=nid placeholder="NID number"><input id=sp type=tel placeholder="Shop phone (customers will call)">
  <label>Your photo (required)</label><input id=f1 type=file accept=image/*><label>Signboard photo (required)</label><input id=f2 type=file accept=image/*><button id=go>Submit for verification</button>`;
  fillDistricts($('#sa'), 'Dhaka'); fillUpazilas($('#su'), 'Dhaka'); $('#sa').onchange = () => fillUpazilas($('#su'), $('#sa').value);
  $('#go').onclick = async () => { const a = $('#f1').files[0], b = $('#f2').files[0]; if (!a || !b || !$('#sn').value || !$('#nid').value || !$('#sp').value) return alert('All fields and both photos are required');
    const { error } = await sb.from('shops').insert({ owner: user.id, name: $('#sn').value, area: $('#sa').value, upazila: $('#su').value, nid_no: $('#nid').value, phone: $('#sp').value, photo_url: await upload(a, 'owners'), signboard_url: await upload(b, 'signs') });
    error ? alert(error.message) : init(); };
}
async function dash() {
  if (!shop.verified) return $('#main').innerHTML = '<h3>Waiting for admin verification…</h3>';
  const [{ data: prods = [] }, { data: ords = [] }, { data: cps = [] }] = await Promise.all([sb.from('products').select('*').eq('shop_id', shop.id), sb.from('orders').select('*').eq('shop_id', shop.id).order('created_at', { ascending: false }), sb.from('coupons').select('*').eq('shop_id', shop.id)]);
  const done = ords.filter(o => o.status === 'delivered'), rev = done.reduce((s, o) => s + o.subtotal - o.discount, 0);
  const sold = {}; done.forEach(o => o.items.forEach(i => sold[i.name] = (sold[i.name] || 0) + i.qty)); const best = Object.entries(sold).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const mon = {}; done.forEach(o => { const k = o.created_at.slice(0, 7); mon[k] = (mon[k] || 0) + o.subtotal - o.discount; });
  $('#main').innerHTML = `<h2>${esc(shop.name)}</h2><div class=stats><div><b>৳${rev}</b>Delivered revenue</div><div><b>${ords.length}</b>Orders</div><div><b>${prods.length}</b>Products</div><div><b>${ords.filter(o => o.status === 'pending').length}</b>Pending</div></div><div class=c>Shop is <b>${shop.is_open === false ? 'CLOSED' : 'OPEN'}</b> <button id=tg>${shop.is_open === false ? 'Open shop' : 'Close shop'}</button><input id=shp type=tel value="${esc(shop.phone)}" placeholder="Shop phone"><button id=sv>Save phone</button></div><p>Monthly: ${Object.entries(mon).map(([k, v]) => `${k}: ৳${v}`).join(' | ') || '-'}<br>Best sellers: ${best.map(b => `${esc(b[0])} (${b[1]})`).join(', ') || '-'}</p>
  <h3>Add product</h3><input id=pn placeholder=Name><textarea id=pd placeholder="Description (size, material, usage)"></textarea><input id=pp type=number placeholder=Price><input id=po type=number placeholder="Offer price (optional → goes to Offers)">
  <select id=pc><option>Medicine</option><option>Garments - Men</option><option>Garments - Women</option><option>Garments - Kids</option><option>Grocery</option><option>Books</option><option>Homemade</option></select>
  <select id=ps><option value=local>Sell in my local area</option><option value=all>Sell all Bangladesh</option></select><input id=pi type=file accept=image/*><button id=pa>Add</button>
  <h3>Products</h3>${prods.map(p => `<div class=c><b>${esc(p.name) || '(no name)'}</b> ৳${p.price} ${p.in_stock ? '' : '<b style=color:#d62828>(SOLD OUT)</b>'}<br><button data-s=${p.id} data-v=${p.in_stock}>${p.in_stock ? 'Mark sold out' : 'Back in stock'}</button><button data-ed=${p.id}>Edit</button><button class=del data-del=${p.id}>Delete</button></div>`).join('')}
  <h3>Coupons</h3>${cps.map(c => `<div>${esc(c.code)} -${c.percent}%</div>`).join('')}<input id=cc placeholder=CODE><input id=cpc type=number placeholder="% off"><button id=ca>Create coupon</button>
  <h3>Orders</h3>${ords.map(o => `<div class=c>${o.status} · ${o.items.map(i => `${esc(i.name)}x${i.qty}`).join(', ')}<br>${esc(o.address)} · ${o.phone ? `<a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a>` : ''} · fee ৳${o.delivery_fee}
  ${o.status === 'pending' ? `<br><input id=nf${o.id} type=number placeholder="Delivery fee (blank = keep)"><button data-ac=${o.id}>Accept</button>` : ''}
  ${o.status === 'accepted' ? `<button data-st=${o.id} data-n=shipped>Shipped</button>` : ''}${o.status === 'shipped' ? `<button data-st=${o.id} data-n=delivered>Delivered</button>` : ''}</div>`).join('')}`;
  $('#pa').onclick = async () => { if (!$('#pn').value.trim() || !(+$('#pp').value > 0)) return alert('Product name and price are required'); const f = $('#pi').files[0]; const { error } = await sb.from('products').insert({ shop_id: shop.id, name: $('#pn').value, description: $('#pd').value, price: +$('#pp').value, offer_price: $('#po').value ? +$('#po').value : null, category: $('#pc').value, scope: $('#ps').value, image_url: f ? await upload(f, 'products') : null }); error ? alert(error.message) : dash(); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => { await sb.from('products').update({ in_stock: b.dataset.v !== 'true' }).eq('id', b.dataset.s); dash(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Delete this product?')) { await sb.from('products').delete().eq('id', b.dataset.del); dash(); } });
  const upd = async (open, phone) => { const { error } = await sb.rpc('update_my_shop', { p_phone: phone, p_open: open }); if (error) return alert(error.message); shop.is_open = open; shop.phone = phone; dash(); };
  $('#tg').onclick = () => upd(shop.is_open === false, $('#shp').value);
  $('#sv').onclick = () => upd(shop.is_open !== false, $('#shp').value);
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = async () => { const p = prods.find(x => x.id === b.dataset.ed); const n = prompt('Name', p.name); if (n === null) return; const pr = prompt('Price', p.price); if (pr === null) return; const of = prompt('Offer price (blank = none)', p.offer_price ?? ''); if (of === null) return;
    await sb.from('products').update({ name: n.trim() || p.name, price: +pr || p.price, offer_price: of === '' ? null : +of }).eq('id', p.id); dash(); });
  $('#ca').onclick = async () => { const { error } = await sb.from('coupons').insert({ code: $('#cc').value, shop_id: shop.id, percent: +$('#cpc').value }); error ? alert(error.message) : dash(); };
  document.querySelectorAll('[data-ac]').forEach(b => b.onclick = async () => { const o = ords.find(x => x.id === b.dataset.ac); const v = $('#nf' + o.id).value; const nf = v === '' ? +o.delivery_fee : +v;
    const upd = nf > +o.delivery_fee ? { new_fee: nf, status: 'awaiting_customer' } : { delivery_fee: nf, status: 'accepted' };
    await sb.from('orders').update(upd).eq('id', o.id); dash(); });
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => { await sb.from('orders').update({ status: b.dataset.n }).eq('id', b.dataset.st); dash(); });
}
init();
</script></body></html>
