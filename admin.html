<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title></head><body>
<div id=auth></div><div id=main></div>
<script type=module>
import { brandHeader, sb, $, esc, me, authBox, getFees, css } from './app.js';
document.head.insertAdjacentHTML('beforeend', css);
document.body.insertAdjacentHTML('afterbegin', brandHeader('Admin'));
let tab = 'dash';
async function init() {
  const u = await me(); if (!u) return authBox($('#auth'), 'customer', init);
  if (u.role !== 'admin') return $('#main').innerHTML = '<h3>Not an admin</h3>';
  $('#auth').innerHTML = ''; load();
}
async function load() {
  const [{ data: shops = [] }, { data: ords = [] }, { data: zones = [] }, { data: reps = [] }, fees, { data: pays = [] }, { data: info = [] }] = await Promise.all([sb.from('shops').select('*').order('verified'), sb.from('orders').select('*').order('created_at', { ascending: false }), sb.from('delivery_zones').select('*'), sb.from('reviews').select('*').eq('reported', true), getFees(), sb.from('commission_payments').select('*').order('created_at', { ascending: false }), sb.from('site_info').select('*')]);
  const I = Object.fromEntries(info.map(r => [r.key, r.value])), pct = fees.commission_percent || 0, name = id => esc(shops.find(s => s.id === id)?.name);
  const done = ords.filter(o => o.status === 'delivered'), sales = done.reduce((s, o) => s + o.subtotal - o.discount, 0), earned = Math.round(sales * pct / 100);
  const ok = pays.filter(p => p.status === 'confirmed'), got = ok.reduce((s, p) => s + +p.amount, 0);
  const rows = shops.map(s => { const sl = done.filter(o => o.shop_id === s.id).reduce((a, o) => a + o.subtotal - o.discount, 0); const paid = ok.filter(p => p.shop_id === s.id).reduce((a, p) => a + +p.amount, 0); return { s, sl, due: Math.round(sl * pct / 100 - paid) }; });
  const pend = pays.filter(p => p.status === 'pending');
  const nav = [['dash', '📊 Dashboard'], ['shops', '🏪 Shops'], ['orders', '📦 Orders'], ['money', `💰 Commission${pend.length ? ' (' + pend.length + ')' : ''}`], ['reviews', '⭐ Reviews'], ['settings', '⚙️ Settings']];
  let body = '';
  if (tab === 'dash') body = `<div class=stats><div class=hl><b>৳${sales}</b>Total sales</div><div class=hl><b>৳${earned}</b>Commission earned (${pct}%)</div><div><b>৳${got}</b>Commission received</div><div><b>৳${earned - got}</b>Commission due</div><div><b>${ords.length}</b>Orders</div><div><b>${shops.length}</b>Shops</div></div><h4>Commission due by shop</h4>${rows.map(r => `<div class=c><b>${esc(r.s.name)}</b><br>Sales ৳${r.sl} · <b style=color:#d62828>Due ৳${r.due}</b></div>`).join('') || '<p>No shops</p>'}`;
  if (tab === 'shops') body = shops.map(s => `<div class=c><b>${esc(s.name)}</b> <span class=pill>${s.verified ? 'Verified' : 'Pending'}</span><br>${esc(s.area)}, ${esc(s.upazila)} · NID ${esc(s.nid_no)} · ${esc(s.phone)}<br><a href="${esc(s.photo_url)}" target=_blank>Owner photo</a> · <a href="${esc(s.signboard_url)}" target=_blank>Signboard</a><br>${s.verified ? `<button class=del data-bl=${s.id}>Block</button>` : `<button data-v=${s.id}>Verify</button>`}</div>`).join('') || '<p>No shops</p>';
  if (tab === 'orders') body = ords.slice(0, 40).map(o => `<div class=c><b>${name(o.shop_id)}</b> <span class=pill>${o.status}</span> <span class=pill>${o.pay_status || 'cod'}</span><br>৳${o.subtotal - o.discount + +o.delivery_fee} · ${esc(o.area)}, ${esc(o.upazila)} · ${new Date(o.created_at).toLocaleDateString()}</div>`).join('') || '<p>No orders</p>';
  if (tab === 'money') body = `<h4>Commission payment requests</h4>${pend.map(p => `<div class=c><b>${name(p.shop_id)}</b> · ৳${p.amount} · TrxID ${esc(p.trx_id)}<br><button data-ok=${p.id}>Confirm</button><button class=del data-no=${p.id}>Reject</button></div>`).join('') || '<p>No pending requests</p>'}<h4>History</h4>${pays.filter(p => p.status !== 'pending').map(p => `<div class=c>${name(p.shop_id)} · ৳${p.amount} · <span class=pill>${p.status}</span></div>`).join('')}`;
  if (tab === 'reviews') body = reps.map(r => `<div class=c>${'★'.repeat(r.rating)} ${esc(r.comment)}<br><i>Vendor note: ${esc(r.report_note)}</i><br><button class=del data-d=${r.id}>Remove review</button><button data-k=${r.id}>Keep review</button></div>`).join('') || '<p>No reported reviews</p>';
  if (tab === 'settings') body = `<div class=c><h4>Fees</h4><label>Commission %</label><input id=cm type=number value="${pct}"><label>Nationwide courier fee</label><input id=cf type=number value="${fees.courier_fee ?? ''}"><label>Default local delivery fee</label><input id=df type=number value="${fees.default_local_fee ?? 60}"></div>
    <div class=c><h4>Our payment numbers (for commission)</h4><input id=ab type=tel placeholder="bKash" value="${esc(I.admin_bkash)}"><input id=an type=tel placeholder="Nagad" value="${esc(I.admin_nagad)}"><input id=ar type=tel placeholder="Rocket" value="${esc(I.admin_rocket)}"><input id=sp type=tel placeholder="Support phone" value="${esc(I.support_phone)}"></div>
    <div class=c><h4>District delivery fees</h4>${zones.map(z => `<div>${esc(z.area)}: ৳<input style="display:inline;width:80px" type=number value=${z.fee} data-z="${esc(z.area)}"></div>`).join('')}<input id=na placeholder="District name (exact)"><input id=nfee type=number placeholder=Fee></div><button id=ss>Save all settings</button>`;
  $('#main').innerHTML = `<div class=tabs2>${nav.map(n => `<button class="${tab === n[0] ? 'on' : ''}" data-tab=${n[0]}>${n[1]}</button>`).join('')}</div>${body}`;
  const all = (s, fn) => document.querySelectorAll(s).forEach(fn), up = (t, id, u) => sb.from(t).update(u).eq('id', id).then(load);
  all('[data-tab]', b => b.onclick = () => { tab = b.dataset.tab; load(); });
  all('[data-v]', b => b.onclick = () => up('shops', b.dataset.v, { verified: true })); all('[data-bl]', b => b.onclick = () => up('shops', b.dataset.bl, { verified: false }));
  all('[data-ok]', b => b.onclick = () => up('commission_payments', b.dataset.ok, { status: 'confirmed' })); all('[data-no]', b => b.onclick = () => up('commission_payments', b.dataset.no, { status: 'rejected' }));
  all('[data-d]', b => b.onclick = async () => { await sb.from('reviews').delete().eq('id', b.dataset.d); load(); }); all('[data-k]', b => b.onclick = () => up('reviews', b.dataset.k, { reported: false }));
  if ($('#ss')) $('#ss').onclick = async () => {
    await sb.from('settings').upsert([{ key: 'commission_percent', value: +$('#cm').value }, { key: 'courier_fee', value: +$('#cf').value }, { key: 'default_local_fee', value: +$('#df').value }]);
    await sb.from('site_info').upsert([['admin_bkash', '#ab'], ['admin_nagad', '#an'], ['admin_rocket', '#ar'], ['support_phone', '#sp']].map(([k, id]) => ({ key: k, value: $(id).value })));
    const z = [...document.querySelectorAll('[data-z]')].map(i => ({ area: i.dataset.z, fee: +i.value })); if ($('#na').value) z.push({ area: $('#na').value.trim(), fee: +$('#nfee').value || 60 }); if (z.length) await sb.from('delivery_zones').upsert(z); alert('Saved'); load(); };
}
init();
</script></body></html>
